# The notification policy tree (rendered into grafana_notification_policy by
# infra module.observability). Receivers are the contact points defined in
# HCL, because they hold secrets: email-owner (the owner's Grafana login)
# and app-push (the alert-hook Edge Function, HMAC-signed).
# Every alert goes to email; alerts labelled push="true" also go to the app's
# admins as a push, which quiet hours hold until 07:30.
receiver: email-owner
group_by: [alertname]
group_wait: 30s
group_interval: 15m
# 1d, not 24h: Grafana stores the duration as 1d, and 24h read as a change on
# every plan.
repeat_interval: 1d
routes:
  - receiver: app-push
    matchers: [{ label: push, match: "=", value: "true" }]
    continue: true
  - receiver: email-owner
