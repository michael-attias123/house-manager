name: visitbr7 dump

# One-off, read-only: the bars on visitbr7.co.il for a hand-made import
# (scripts/visitbr7-dump.py). Removed once the import is written.
on:
  workflow_dispatch:
  push:
    paths: ['scripts/visitbr7-dump.py', '.github/workflows/visitbr7-dump.yml']

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -u scripts/visitbr7-dump.py
