name: Observability sync

# Reconciles Grafana alerting (observability/alerts, observability/alerting)
# and the synthetic checks with git, through shared-platform's tofu-stack.yml:
# OpenTofu plans only module.observability and module.uptime, the guard
# refuses any change outside them, and the saved plan is applied. Dashboards
# are pulled by Grafana Git Sync instead (observability/README.md).
# - Push to main on observability/alerts or alerting: applies the merged
#   change. Dashboard-only pushes need nothing here (Git Sync pulls them;
#   with dashboards_via_git_sync = false the 30-minute run applies them).
# - Every 30 minutes and from the Actions tab: reverts edits made outside git
#   (API or provisioning) and reports them on the infra-drift issue
#   (infra/scripts/obs-drift-report.sh).
# A plan that failed only because Grafana was down is retried once; on a
# scheduled run it then ends with a warning, unless no run has reached Grafana
# for 6 hours (shared-platform tools/tofu_plan.sh).
# Skips with a notice until observability_enabled = true in
# infra/prod.auto.tfvars and the VAULT_ADDR variable exists. Credentials as in
# infra.yml; keep them in step.
on:
  push:
    branches: [main]
    paths: ['observability/alerts/**', 'observability/alerting/**']
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  # Decides whether to reconcile. Reads no secret.
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: gate
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: |
          ready=false
          if ! grep -Eq '^[[:space:]]*observability_enabled[[:space:]]*=[[:space:]]*true([[:space:]]|#|$)' infra/prod.auto.tfvars; then
            echo "::notice::Observability sync is off until observability_enabled = true in infra/prod.auto.tfvars."
          elif [[ -z "$VAULT_ADDR" ]]; then
            echo "::notice::Observability sync is skipped until the VAULT_ADDR variable exists (infra/BOOTSTRAP.md)."
          else
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  reconcile:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    # Its own group, not infra.yml's "infra": GitHub keeps one pending job per
    # group and cancels the older one, so a queued reconcile could replace a
    # pending infra.yml apply. Two writers on the state are prevented by the
    # pg backend's state lock instead (-lock-timeout=5m in tofu-stack).
    concurrency:
      group: observability-sync
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write
      issues: write
    uses: michael-attias123/shared-platform/.github/workflows/tofu-stack.yml@main
    with:
      dir: infra
      name: observability
      mode: apply
      tofu-version: 1.12.8
      targets: |
        module.observability
        module.uptime
      guard-allow: |
        module.observability
        module.uptime
      allow-outage: ${{ github.event_name != 'push' }}
      vault-role: house-manager-michael-attias123-house-manager-main
      vault-export-token: true
      github-app: true
      pre-plan: infra/scripts/grafana-env.sh
      post-apply: infra/scripts/obs-drift-report.sh
      platform-ref: ${{ vars.PLATFORM_REF || 'main' }}
      vault-secrets: |
        kv/data/house-manager/state pg_conn | PG_CONN_STR
        kv/data/house-manager/state passphrase | TF_VAR_state_passphrase
        kv/data/house-manager/providers cloudflare_api_token | CLOUDFLARE_API_TOKEN
        kv/data/house-manager/providers github_app_id | GITHUB_APP_ID
        kv/data/house-manager/providers github_app_private_key | GITHUB_APP_PRIVATE_KEY
        kv/data/shared/supabase access_token | SUPABASE_ACCESS_TOKEN
        kv/data/shared/grafana cloud_token | GRAFANA_CLOUD_TOKEN
        kv/data/shared/grafana sa_token | GRAFANA_SA_TOKEN
