name: Observability sync

# Reconciles Grafana alerting (observability/alerts, observability/alerting)
# and the synthetic checks with git: OpenTofu plans only module.observability
# and module.uptime, scripts/observability/plan_guard.py refuses any change
# outside them, and the saved plan is applied. Dashboards are pulled by
# Grafana Git Sync instead (observability/README.md).
# - Push to main on observability/alerts or alerting: applies the merged
#   change. Dashboard-only pushes need nothing here (Git Sync pulls them;
#   with dashboards_via_git_sync = false the 30-minute run applies them).
# - Every 30 minutes and from the Actions tab: reverts edits made outside git
#   (API or provisioning) and reports them on the infra-drift issue.
# Skips with a notice until observability_enabled = true in
# infra/prod.auto.tfvars and the secrets exist. Setup and env mirror
# infra.yml; keep them in step.
on:
  push:
    branches: [main]
    paths: ['observability/alerts/**', 'observability/alerting/**']
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions: {}

env:
  TOFU_VERSION: 1.12.8
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

jobs:
  # Decides whether to reconcile. Reads secret presence only.
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_STATE_PG_CONN: ${{ secrets.TF_STATE_PG_CONN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE }}
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
        run: |
          ready=false
          if ! grep -Eq '^[[:space:]]*observability_enabled[[:space:]]*=[[:space:]]*true([[:space:]]|#|$)' infra/prod.auto.tfvars; then
            echo "::notice::Observability sync is off until observability_enabled = true in infra/prod.auto.tfvars."
            echo "ready=$ready" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          for name in CLOUDFLARE_API_TOKEN TF_STATE_PG_CONN SUPABASE_ACCESS_TOKEN GH_ADMIN_TOKEN \
                      SOPS_AGE_KEY TF_STATE_PASSPHRASE GRAFANA_CLOUD_TOKEN GRAFANA_SA_TOKEN; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::notice::Observability sync is skipped until these secrets exist: ${missing[*]} (see infra/BOOTSTRAP.md)."
          elif [[ ! -f infra/secrets.enc.yaml ]]; then
            echo "::notice::Observability sync is skipped until infra/secrets.enc.yaml exists (see infra/BOOTSTRAP.md)."
          else
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  reconcile:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own group, not infra.yml's "infra": GitHub keeps one pending job per
    # group and cancels the older one, so a queued reconcile could replace a
    # pending infra.yml apply. Two writers on the state are prevented by the
    # pg backend's state lock instead (-lock-timeout=5m here and in infra.yml).
    concurrency:
      group: observability-sync
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: read
    defaults:
      run:
        working-directory: infra
    # As in infra.yml. Never echoed; the plan and apply output stay in files
    # and only their summary lines and resource addresses are printed.
    env:
      PG_CONN_STR: ${{ secrets.TF_STATE_PG_CONN }}
      TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The history decides whether a difference came from a commit.
          fetch-depth: 0
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      # The same token mapping as infra.yml (infra/scripts/grafana-env.sh).
      - name: Grafana credentials
        env:
          GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
        run: ./scripts/grafana-env.sh
      - run: tofu init -input=false -no-color > "$RUNNER_TEMP/init.log" || { grep -A8 '^Error' "$RUNNER_TEMP/init.log"; exit 1; }
      # 0 = in sync, 2 = changes (guarded and applied below), anything else fails.
      - id: plan
        run: |
          set +e
          tofu plan -detailed-exitcode -no-color -input=false -lock-timeout=5m \
            -target=module.observability -target=module.uptime -out=tfplan > "$RUNNER_TEMP/plan.log" 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "In sync with $GITHUB_SHA: nothing to do." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            2) grep -m1 -E '^Plan: ' "$RUNNER_TEMP/plan.log" || true ;;
            *) grep -A8 '^Error' "$RUNNER_TEMP/plan.log" || echo "The plan failed."; exit 1 ;;
          esac
      - name: Guard (only module.observability and module.uptime)
        if: steps.plan.outputs.exitcode == '2'
        id: guard
        run: |
          tofu show -json tfplan > "$RUNNER_TEMP/plan.json"
          python3 ../scripts/observability/plan_guard.py "$RUNNER_TEMP/plan.json" | tee "$RUNNER_TEMP/changes.txt"
          echo "count=$(grep -c '^  ' "$RUNNER_TEMP/changes.txt" || true)" >> "$GITHUB_OUTPUT"
      - name: Apply the saved plan
        if: steps.plan.outputs.exitcode == '2'
        run: |
          if ! tofu apply -input=false -no-color -lock-timeout=5m tfplan > "$RUNNER_TEMP/apply.log" 2>&1; then
            grep -A8 '^Error' "$RUNNER_TEMP/apply.log" || echo "The apply failed."
            exit 1
          fi
          grep -m1 -E '^Apply complete' "$RUNNER_TEMP/apply.log" || true
          {
            echo "Reconciled ${{ steps.guard.outputs.count }} resource(s) from ${GITHUB_SHA:0:7}:"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/changes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # A push run applies a merged commit. A scheduled or manual run with
      # nothing new in observability/ or infra/ since the last successful sync
      # found an edit made outside git, and says so on the infra-drift issue.
      - name: Report drift not caused by a commit
        if: steps.plan.outputs.exitcode == '2' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          last="$(gh api "repos/$GH_REPO/actions/workflows/observability-sync.yml/runs?branch=main&status=success&per_page=1" \
                    --jq '.workflow_runs[0].head_sha // empty')"
          if [[ -n "$last" && "$last" != "$GITHUB_SHA" ]] && git cat-file -e "$last^{commit}" 2>/dev/null \
             && ! git diff --quiet "$last" "$GITHUB_SHA" -- ../observability ../infra; then
            echo "Changes since the last successful sync (${last:0:7}) came from commits: not drift."
            exit 0
          fi
          body="$RUNNER_TEMP/comment.md"
          {
            echo "The observability sync reverted changes made outside git ($(date -u +'%F %H:%M') UTC, [run log]($RUN_URL))."
            echo "Edit \`observability/\` in a PR instead; for an emergency, a Grafana silence is fine."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/changes.txt"
            echo '```'
          } > "$body"
          gh label create infra-drift --color D93F0B \
            --description 'The live infrastructure differs from infra/' --force >/dev/null
          number="$(gh issue list --label infra-drift --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file "$body" >/dev/null
            echo "::warning::Drift reverted: commented on issue #$number."
          else
            url="$(gh issue create --title 'Infrastructure drift: the live setup differs from infra/' \
                     --label infra-drift --body-file "$body")"
            echo "::warning::Drift reverted: opened $url."
          fi
