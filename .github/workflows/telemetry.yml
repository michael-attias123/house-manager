name: Workflow telemetry

# Turns each finished run of the scheduled and deploying workflows into a trace
# (workflow, jobs, steps, with their real times) and two gauges in Grafana
# Cloud, through shared-platform's gha-telemetry.yml (tools/gha_trace.py).
# Allow-listed attributes only: never the branch, commit, actor, names or
# emails. It prints counts only, since the logs are public, and a failed
# export is a warning, not a failed run. The OTLP endpoint and headers come
# from kv/house-manager/generated (written by infra/).
on:
  workflow_run:
    # The `name:` of prices.yml, venues.yml, db-migrate.yml and infra.yml.
    workflows: ['Supermarket prices', 'Places to go out', 'Database migrations', 'Infrastructure']
    types: [completed]

permissions: {}

jobs:
  trace:
    if: vars.VAULT_ADDR != ''
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: michael-attias123/shared-platform/.github/workflows/gha-telemetry.yml@main
    with:
      workflows: prices,venues,db-migrate,infra
      service-name: gha-telemetry
      vault-role: house-manager-michael-attias123-house-manager-main
      vault-secrets: |
        kv/data/house-manager/generated otlp_endpoint | OTEL_EXPORTER_OTLP_ENDPOINT
        kv/data/house-manager/generated ci_otlp_headers | OTEL_EXPORTER_OTLP_HEADERS
