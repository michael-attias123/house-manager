name: One-off state cleanup

# Temporary (deleted in the next commit): forgets the stale state record of
# supabase_apikey.grafana_metrics, whose key was deleted in Supabase. Changes
# nothing outside the state. Prints resource addresses only.
on:
  push:
    branches: [fix/metrics-key]
    paths: ['.github/workflows/state-rm-once.yml']

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  state-rm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    env:
      PG_CONN_STR: ${{ secrets.TF_STATE_PG_CONN }}
      TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.12.8
          tofu_wrapper: false
      - run: tofu init -input=false -no-color > /dev/null
      - name: Before
        run: tofu state list -no-color | grep grafana_metrics || echo "no grafana_metrics record"
      - name: Forget the stale key record
        run: |
          if tofu state list -no-color | grep -qx 'module.backend.supabase_apikey.grafana_metrics\[0\]'; then
            tofu state rm -lock-timeout=5m -no-color 'module.backend.supabase_apikey.grafana_metrics[0]'
          else
            echo "nothing to remove"
          fi
      - name: After
        run: tofu state list -no-color | grep grafana_metrics || echo "gone"
