name: Places probe

# Read-only: what Dapei Zahav, Club Hub ("חבר טעמים"), Wolt and Isracard's
# "חבר" page know about places to go out in Be'er Sheva
# (scripts/places-probe.py). Nothing is written anywhere.
on:
  workflow_dispatch:
  # Also whenever the probe itself changes, so it can be tried from a branch.
  push:
    paths: ['scripts/places-probe.py', '.github/workflows/places-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -u scripts/places-probe.py
