name: Bootstrap check

# Read-only: checks the "layer zero" that infra/ (OpenTofu) cannot create for
# itself (infra/BOOTSTRAP.md): this repo can log in to the shared Vault, every
# key house-manager needs is there (shared-platform projects/house-manager.yaml),
# and every token works. Each item prints ✓ or ✗ with how to fix it, never a
# value. Every check runs; the job fails at the end if any failed.
# Run it from the Actions tab before the first plan; infra.yml also runs it
# before every plan, apply and drift check.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      vault-role:
        description: The shared Vault role (the pr role on pull requests).
        type: string
        default: house-manager-michael-attias123-house-manager-main

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Shared by the steps below: ok/bad print one line each (and add it to
      # the run summary); bearer feeds curl a header without putting the
      # token on its command line (curl -H @<(bearer "$TOKEN")).
      - name: Prepare
        run: |
          cat > "$RUNNER_TEMP/check.sh" <<'EOF'
          failed=0
          ok() { echo "✓ $*"; echo "- ✓ $*" >> "$GITHUB_STEP_SUMMARY"; }
          bad() { echo "::error::✗ $*"; echo "- ✗ $*" >> "$GITHUB_STEP_SUMMARY"; failed=1; }
          skip() { echo "::notice::– $*"; echo "- – $*" >> "$GITHUB_STEP_SUMMARY"; }
          bearer() { printf 'Authorization: Bearer %s\n' "$1"; }
          # Monitoring switches, read like cloudflare_account_id (not secrets).
          tfvar() { sed -n "s/^$1 *= *\"\{0,1\}\([^\"]*\)\"\{0,1\} *\$/\1/p" infra/prod.auto.tfvars | sed 's/ *#.*//'; }
          OBSERVABILITY="$(tfvar observability_enabled)"
          GIT_SYNC="$(tfvar dashboards_via_git_sync)"
          GRAFANA_SLUG="$(tfvar grafana_stack_slug)"
          # Monitoring checks only warn while monitoring is off: infra.yml runs
          # this check before every plan, which must not depend on Grafana yet.
          monitoring_checks() {
            if [[ "$OBSERVABILITY" != true ]]; then
              bad() { echo "::warning::✗ $* (not blocking while observability_enabled is false)"; echo "- ⚠ $*" >> "$GITHUB_STEP_SUMMARY"; }
            fi
          }
          EOF
          echo "### Bootstrap check" >> "$GITHUB_STEP_SUMMARY"

      # Every key of projects/house-manager.yaml (and the shared ones this repo
      # reads), masked. A missing key stops this step with its path and name;
      # the values read before it stay set for the checks below.
      - name: The shared Vault has every key
        id: vault
        continue-on-error: true
        uses: michael-attias123/shared-platform/.github/actions/vault-env@main
        with:
          addr: ${{ vars.VAULT_ADDR }}
          role: ${{ inputs.vault-role || 'house-manager-michael-attias123-house-manager-main' }}
          secrets: |
            kv/data/house-manager/providers cloudflare_api_token | CLOUDFLARE_API_TOKEN
            kv/data/house-manager/providers github_app_id | GITHUB_APP_ID
            kv/data/house-manager/providers github_app_private_key | GITHUB_APP_PRIVATE_KEY
            kv/data/house-manager/state pg_conn | TF_STATE_PG_CONN
            kv/data/house-manager/state passphrase | TF_STATE_PASSPHRASE
            kv/data/shared/supabase access_token | SUPABASE_ACCESS_TOKEN
            kv/data/shared/grafana cloud_token | GRAFANA_CLOUD_TOKEN
            kv/data/shared/grafana sa_token | GRAFANA_SA_TOKEN
            kv/data/house-manager/monitoring gitsync_github_token | GITSYNC_GITHUB_TOKEN
            kv/data/house-manager/monitoring grafana_reader_password | CHECK_GRAFANA_READER_PASSWORD
            kv/data/house-manager/monitoring alert_webhook_secret | CHECK_ALERT_WEBHOOK_SECRET
            kv/data/house-manager/monitoring alert_email | CHECK_ALERT_EMAIL
            kv/data/house-manager/app vapid_public_key | CHECK_VAPID_PUBLIC_KEY
            kv/data/house-manager/app vapid_private_key | CHECK_VAPID_PRIVATE_KEY
            kv/data/house-manager/app vapid_subject | CHECK_VAPID_SUBJECT
            kv/data/house-manager/app push_secret | CHECK_PUSH_SECRET
            kv/data/house-manager/app google_client_id | CHECK_GOOGLE_CLIENT_ID
            kv/data/house-manager/app google_client_secret | CHECK_GOOGLE_CLIENT_SECRET
            kv/data/house-manager/app supabase_db_password | CHECK_SUPABASE_DB_PASSWORD
            kv/data/house-manager/app supabase_db_url | CHECK_SUPABASE_DB_URL
      - name: Vault result
        id: vault_result
        continue-on-error: true
        env:
          OUTCOME: ${{ steps.vault.outcome }}
        run: |
          . "$RUNNER_TEMP/check.sh"
          if [[ "$OUTCOME" == success ]]; then
            ok "this repo logs in to the shared Vault, and every key is there"
          else
            bad "the shared Vault: the login or a key failed (the step above names it). Fix: VAULT_ADDR variable, shared-platform projects/house-manager.yaml, make vault-seed PROJECT=house-manager"
          fi
          exit "$failed"

      - name: Cloudflare token is valid and can read Pages
        id: cloudflare
        continue-on-error: true
        run: |
          . "$RUNNER_TEMP/check.sh"
          # Not a secret: the account id is in infra/prod.auto.tfvars.
          CLOUDFLARE_ACCOUNT_ID="$(sed -n 's/^cloudflare_account_id *= *"\([0-9a-f]\{32\}\)".*/\1/p' infra/prod.auto.tfvars)"
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            bad "Cloudflare: CLOUDFLARE_API_TOKEN is not set"
            exit "$failed"
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            bad "Cloudflare: set cloudflare_account_id in infra/prod.auto.tfvars (32 hex characters, from the dashboard's account home)"
            exit "$failed"
          fi
          api=https://api.cloudflare.com/client/v4
          out="$RUNNER_TEMP/cloudflare.json"
          get() {
            curl -sS --max-time 20 -o "$out" -w '%{http_code}' -H @<(bearer "$CLOUDFLARE_API_TOKEN") "$api$1" || true
          }
          # An account-owned token verifies under the account, a user token under /user.
          verified=""
          for path in "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" /user/tokens/verify; do
            if [[ "$(get "$path")" == 200 ]] && jq -e '.success and .result.status == "active"' "$out" >/dev/null; then
              verified="$path"
              expires="$(jq -r '.result.expires_on // empty' "$out")"
              break
            fi
          done
          if [[ -n "$verified" ]]; then
            ok "Cloudflare token is active${expires:+ (expires $expires)}"
          else
            bad "Cloudflare token is not valid or not active: create one under My Profile → API Tokens (infra/BOOTSTRAP.md)"
          fi
          code="$(get "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"
          if [[ "$code" == 200 ]] && jq -e '.success' "$out" >/dev/null; then
            ok "Cloudflare token can list the account's Pages projects"
          else
            bad "Cloudflare token cannot list Pages projects (HTTP $code): give it Account → Cloudflare Pages: Edit on this account, and check cloudflare_account_id"
          fi
          rm -f "$out"
          exit "$failed"

      # The state lives in Supabase Postgres (infra/backend.tf). Each -c is its
      # own transaction: through the Transaction pooler the unlock can land on
      # another connection and fail, which is exactly the problem to catch.
      - name: The state database connection works
        id: state
        continue-on-error: true
        env:
          PGCONNECT_TIMEOUT: '15'
        run: |
          . "$RUNNER_TEMP/check.sh"
          if [[ -z "$TF_STATE_PG_CONN" ]]; then
            bad "State: TF_STATE_PG_CONN is not set"
            exit "$failed"
          fi
          conn="$(printf %s "$TF_STATE_PG_CONN" | tr -d '\r\n')"
          if [[ "$conn" == *:6543/* ]]; then
            bad "TF_STATE_PG_CONN uses port 6543 (Transaction pooler), which drops the state lock: use the Session pooler string, port 5432"
          fi
          if out="$(psql "$conn" -X -At -v ON_ERROR_STOP=1 \
                      -c 'select current_user' \
                      -c "select has_table_privilege('tofu_state.states', 'select, insert, update, delete')" \
                      -c 'select pg_try_advisory_lock(424242)' \
                      -c 'select pg_advisory_unlock(424242)' 2>&1)"; then
            mapfile -t r <<< "$out"
            if [[ "${r[0]}" == tofu_state ]]; then
              ok "TF_STATE_PG_CONN connects as tofu_state"
            else
              bad "TF_STATE_PG_CONN connects as ${r[0]}, not tofu_state: use the tofu_state role, not postgres (least privilege)"
            fi
            if [[ "${r[1]}" == t ]]; then
              ok "tofu_state can read and write tofu_state.states"
            else
              bad "tofu_state cannot write tofu_state.states: check that the migration 20261028000100_tofu_state.sql ran"
            fi
            if [[ "${r[2]}" == t && "${r[3]}" == t ]]; then
              ok "State locks hold across statements (session connection)"
            else
              bad "State locks do not hold across statements: use the Session pooler string, port 5432"
            fi
          else
            case "$out" in
              *password*) hint="wrong password, or the role has none yet: alter role tofu_state with login password '…'" ;;
              *"does not exist"*|*"not found"*) hint="unknown user: the pooler user is tofu_state.<project_ref>" ;;
              *) hint="$(printf %s "$out" | grep -v -i 'postgres\(ql\)\?://' | tail -1)" ;;
            esac
            bad "TF_STATE_PG_CONN cannot connect: $hint (infra/BOOTSTRAP.md)"
          fi
          exit "$failed"

      - name: Supabase token is valid
        id: supabase
        continue-on-error: true
        run: |
          . "$RUNNER_TEMP/check.sh"
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            bad "Supabase: SUPABASE_ACCESS_TOKEN is not set"
            exit "$failed"
          fi
          code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
                    -H @<(bearer "$SUPABASE_ACCESS_TOKEN") https://api.supabase.com/v1/projects || true)"
          if [[ "$code" == 200 ]]; then
            ok "Supabase token can list projects"
          else
            bad "Supabase token was refused (HTTP $code): create a new one at supabase.com/dashboard/account/tokens (infra/BOOTSTRAP.md)"
          fi
          exit "$failed"

      - name: GitHub App token
        id: app_token
        continue-on-error: true
        if: env.GITHUB_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: The GitHub App can manage Actions secrets and variables
        id: github
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          . "$RUNNER_TEMP/check.sh"
          if [[ -z "$APP_TOKEN" ]]; then
            bad "GitHub: no installation token from the house-manager-bot app (its id and key in kv/house-manager/providers? installed on $GITHUB_REPOSITORY? shared-platform docs/runbooks/github-apps.md)"
            exit "$failed"
          fi
          for path in actions/secrets/public-key actions/variables; do
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H @<(bearer "$APP_TOKEN") \
                      -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
                      "https://api.github.com/repos/$GITHUB_REPOSITORY/$path" || true)"
            if [[ "$code" == 200 ]]; then
              ok "the GitHub App can read $path"
            else
              bad "the GitHub App was refused $path (HTTP $code): give it Secrets and Variables: Read and write, Administration: Read and write (github-apps.md)"
            fi
          done
          exit "$failed"

      # Bootstrap items 7 and 8. Checked while observability_enabled is true,
      # or whenever the secrets exist (so they can be tested before the flag
      # is turned on). Never needed for a plan while the flag is off.
      - name: Grafana tokens work
        id: grafana
        continue-on-error: true
        run: |
          . "$RUNNER_TEMP/check.sh"
          monitoring_checks
          if [[ "$OBSERVABILITY" != true && -z "$GRAFANA_CLOUD_TOKEN" && -z "$GRAFANA_SA_TOKEN" ]]; then
            skip "Grafana: observability_enabled is false and its secrets are not set (infra/BOOTSTRAP.md, items 7 and 8)"
            exit 0
          fi
          if [[ -z "$GRAFANA_SLUG" ]]; then
            bad "Grafana: set grafana_stack_slug in infra/prod.auto.tfvars (the <slug> of https://<slug>.grafana.net)"
            exit "$failed"
          fi
          out="$RUNNER_TEMP/grafana.json"
          get() { # token url
            curl -sS --max-time 20 -o "$out" -w '%{http_code}' -H @<(bearer "$1") "$2" || true
          }
          stack_id=""
          if [[ -z "$GRAFANA_CLOUD_TOKEN" ]]; then
            bad "GRAFANA_CLOUD_TOKEN is missing: an access policy token from grafana.com (infra/BOOTSTRAP.md, item 7)"
          else
            code="$(get "$GRAFANA_CLOUD_TOKEN" "https://grafana.com/api/instances/$GRAFANA_SLUG")"
            if [[ "$code" == 200 ]] && jq -e '.status == "active"' "$out" >/dev/null; then
              ok "GRAFANA_CLOUD_TOKEN can read the stack $GRAFANA_SLUG (stacks:read), and it is active"
              stack_id="$(jq -r '.id' "$out")"
              region="$(jq -r '.regionSlug' "$out")"
              code="$(get "$GRAFANA_CLOUD_TOKEN" "https://grafana.com/api/v1/accesspolicies?region=$region")"
              if [[ "$code" == 200 ]]; then
                ok "GRAFANA_CLOUD_TOKEN can list access policies (accesspolicies:read)"
              else
                bad "GRAFANA_CLOUD_TOKEN cannot list access policies (HTTP $code): add the accesspolicies:read/write/delete scopes (item 7)"
              fi
            else
              bad "GRAFANA_CLOUD_TOKEN cannot read the stack $GRAFANA_SLUG (HTTP $code): check the token, its stacks:read scope and the slug (item 7)"
            fi
          fi
          if [[ -z "$GRAFANA_SA_TOKEN" ]]; then
            bad "GRAFANA_SA_TOKEN is missing: a service account token of the stack, role Admin (infra/BOOTSTRAP.md, item 8)"
          else
            api="https://$GRAFANA_SLUG.grafana.net"
            code="$(get "$GRAFANA_SA_TOKEN" "$api/api/datasources")"
            if [[ "$code" == 200 ]]; then ok "GRAFANA_SA_TOKEN can read data sources"; else
              bad "GRAFANA_SA_TOKEN cannot read data sources (HTTP $code): a service account token with role Admin (item 8)"; fi
            code="$(get "$GRAFANA_SA_TOKEN" "$api/api/v1/provisioning/contact-points")"
            if [[ "$code" == 200 ]]; then ok "GRAFANA_SA_TOKEN can read alerting provisioning"; else
              bad "GRAFANA_SA_TOKEN cannot read alerting provisioning (HTTP $code): role Admin is needed (item 8)"; fi
            if [[ -n "$stack_id" && "$GIT_SYNC" != false ]]; then
              code="$(get "$GRAFANA_SA_TOKEN" "$api/apis/provisioning.grafana.app/v0alpha1/namespaces/stacks-$stack_id/repositories")"
              if [[ "$code" == 200 ]]; then ok "Git Sync is available and GRAFANA_SA_TOKEN can manage it"; else
                bad "Git Sync repositories cannot be listed (HTTP $code): is Git Sync enabled on the stack (Administration → Provisioning)? Or set dashboards_via_git_sync = false"; fi
            fi
          fi
          rm -f "$out"
          exit "$failed"

      # Bootstrap item 9: Git Sync's GitHub token, kv/house-manager/monitoring.
      - name: Git Sync GitHub token works
        id: gitsync
        continue-on-error: true
        run: |
          . "$RUNNER_TEMP/check.sh"
          monitoring_checks
          if [[ "$GIT_SYNC" == false ]]; then
            skip "Git Sync token: not used (dashboards_via_git_sync = false)"
            exit 0
          fi
          token="${GITSYNC_GITHUB_TOKEN:-}"
          if [[ -z "$token" ]]; then
            if [[ "$OBSERVABILITY" == true ]]; then
              bad "gitsync_github_token is not set (infra/BOOTSTRAP.md, item 9)"
            else
              skip "gitsync_github_token is not set yet (item 9; needed before observability_enabled = true)"
            fi
            exit "$failed"
          fi
          gh_get() {
            curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H @<(bearer "$token") \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY$1" || true
          }
          if [[ "$(gh_get "")" == 200 ]]; then ok "gitsync_github_token can read $GITHUB_REPOSITORY"; else
            bad "gitsync_github_token was refused: a fine-grained token for $GITHUB_REPOSITORY only (item 9)"; fi
          # Webhooks: read and write is what lets Grafana install its push webhook.
          if [[ "$(gh_get /hooks)" == 200 ]]; then ok "gitsync_github_token can manage webhooks"; else
            bad "gitsync_github_token cannot read webhooks: give it Webhooks: Read and write (item 9)"; fi
          token=
          exit "$failed"

      - name: TF_STATE_PASSPHRASE is long enough
        id: passphrase
        continue-on-error: true
        run: |
          . "$RUNNER_TEMP/check.sh"
          if (( ${#TF_STATE_PASSPHRASE} >= 32 )); then
            ok "TF_STATE_PASSPHRASE has at least 32 characters"
          else
            bad "TF_STATE_PASSPHRASE is shorter than 32 characters: generate one with openssl rand -base64 32, and keep a copy in your password manager"
          fi
          exit "$failed"

      - name: Result
        if: always()
        env:
          FAILED: ${{ contains(steps.*.outcome, 'failure') }}
        run: |
          if [[ "$FAILED" == true ]]; then
            echo "::error::Some bootstrap checks failed: see the ✗ lines above (infra/BOOTSTRAP.md)."
            exit 1
          fi
          echo "✓ Every bootstrap check passed."
