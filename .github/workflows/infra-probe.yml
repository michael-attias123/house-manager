name: Infra provider probe

# Read-only: downloads the pinned providers (infra/probe) and prints which
# resources and data sources each one offers, plus the attributes of the ones
# the IaC plan depends on. Needs no secrets and touches no account.
on:
  workflow_dispatch:
  push:
    paths: ['infra/probe/**', '.github/workflows/infra-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/probe
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      - run: tofu init -input=false -no-color
      - run: tofu version
      - name: Resources and data sources per provider
        run: |
          tofu providers schema -json > schema.json
          jq -r '.provider_schemas | to_entries[] |
            "== \(.key)",
            "  resources:    \((.value.resource_schemas // {}) | keys | join(" "))",
            "  data sources: \((.value.data_source_schemas // {}) | keys | join(" "))"' schema.json
      - name: Attributes of the resources the plan needs
        run: |
          for r in supabase_settings supabase_project supabase_apikeys \
                   cloudflare_pages_project cloudflare_pages_domain cloudflare_r2_bucket \
                   github_actions_secret github_branch_protection github_repository_ruleset; do
            echo "== $r"
            jq -r --arg r "$r" '.provider_schemas[] |
              (.resource_schemas[$r] // .data_source_schemas[$r] // empty) | .block |
              ((.attributes // {}) | to_entries[] | "  attr  \(.key)  \(.value.type | tostring)  \(if .value.sensitive then "sensitive" else "" end)"),
              ((.block_types // {}) | keys[] | "  block \(.)")' schema.json
          done
      - name: Deployment config attributes (env vars) of cloudflare_pages_project
        run: |
          jq '.provider_schemas[] | .resource_schemas.cloudflare_pages_project.block.attributes.deployment_configs // empty' schema.json | head -c 6000
