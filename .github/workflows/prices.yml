name: Supermarket prices

# Loads the day's Price Transparency files for the stores in config.yaml.
on:
  schedule:
    - cron: '17 3 * * *' # 06:17 in Israel (summer time)
  workflow_dispatch:
    inputs:
      chains:
        description: 'Chain ids, comma separated (empty = all in ingest/config.yaml)'
        required: false
        default: ''

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ingest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Skip until Supabase is connected
        if: env.SUPABASE_DB_URL == ''
        # Runs before checkout, so not in the ingest/ default directory.
        working-directory: .
        run: echo "::notice::Add the SUPABASE_DB_URL secret to load prices (see docs/setup.md)."
      - uses: actions/checkout@v5
        if: env.SUPABASE_DB_URL != ''
      - uses: actions/setup-python@v6
        if: env.SUPABASE_DB_URL != ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - if: env.SUPABASE_DB_URL != ''
        run: |
          pip install -r requirements.txt
          # Some chains' sites are only reachable through a real browser.
          python -m playwright install --with-deps chromium
      - if: env.SUPABASE_DB_URL != ''
        env:
          CHAINS: ${{ inputs.chains }}
        run: python -m house_ingest run ${CHAINS:+--chains "$CHAINS"}
