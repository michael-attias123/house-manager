name: Places to go out

# Loads bars, pubs, restaurants and cafés in Be'er Sheva from OpenStreetMap
# (ingest/house_ingest/venues.py) for "לאן יוצאים". A partial Overpass answer
# changes nothing and fails the run.
on:
  schedule:
    - cron: '37 5 * * 0' # Sunday 08:37 in Israel (summer time)
  workflow_dispatch:

concurrency:
  group: venues
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingest
    env:
      # The shared Vault; SUPABASE_DB_URL and the rest come from it (step below).
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
    steps:
      - name: Skip until Supabase is connected
        if: env.VAULT_ADDR == ''
        # Runs before checkout, so not in the ingest/ default directory.
        working-directory: .
        run: echo "::notice::Skipped until the VAULT_ADDR variable exists (house-manager infra/BOOTSTRAP.md)."
      # The job's own OIDC token logs in to the shared Vault (no Actions secrets).
      - name: Credentials from the shared Vault
        if: env.VAULT_ADDR != ''
        uses: michael-attias123/shared-platform/.github/actions/vault-env@main
        with:
          addr: ${{ vars.VAULT_ADDR }}
          role: house-manager-michael-attias123-house-manager-main
          secrets: |
            kv/data/house-manager/app supabase_db_url | SUPABASE_DB_URL
      - uses: actions/checkout@v5
        if: env.SUPABASE_DB_URL != ''
      - uses: actions/setup-python@v6
        if: env.SUPABASE_DB_URL != ''
        with:
          python-version: '3.12'
      # Only psycopg, at the version requirements.txt pins: the loader needs
      # neither the price scraper nor lxml.
      - if: env.SUPABASE_DB_URL != ''
        run: pip install "$(grep '^psycopg' requirements.txt)"
      - if: env.SUPABASE_DB_URL != ''
        run: python -m house_ingest.venues
