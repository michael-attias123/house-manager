name: Database migrations

# Applies supabase/migrations to the Supabase project when they change on main,
# then deploys the Edge Functions (supabase/functions).
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Only for deploying the Edge Function; the CLI reads the token from the env.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip until Supabase is connected
        if: env.SUPABASE_DB_URL == ''
        run: echo "::notice::Add the SUPABASE_DB_URL secret to apply migrations (see docs/setup.md)."
      - uses: actions/checkout@v5
        if: env.SUPABASE_DB_URL != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_DB_URL != ''
        with:
          # A fixed version: "latest" asks the GitHub API, which rate-limits shared runners.
          version: 2.121.0
      - if: env.SUPABASE_DB_URL != ''
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
      # The database calls send-push with its own secret header, not a user's
      # JWT (supabase/config.toml says the same for local runs).
      - name: Deploy the send-push Edge Function
        if: env.SUPABASE_DB_URL != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Skip the Edge Function until it can be deployed
        if: env.SUPABASE_DB_URL != '' && (env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == '')
        run: echo "::notice::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF secrets to deploy the send-push function for push notifications (see docs/setup.md)."
