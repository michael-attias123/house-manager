name: Database migrations

# Applies supabase/migrations to the Supabase project when they change on main,
# then deploys the Edge Functions (supabase/functions).
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # The shared Vault; SUPABASE_DB_URL and the rest come from it (step below).
      VAULT_ADDR: ${{ vars.VAULT_ADDR }}
      # Only for deploying the Edge Functions (SUPABASE_ACCESS_TOKEN comes from
      # the shared Vault; the CLI reads it from the env). Not a secret.
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip until Supabase is connected
        if: env.VAULT_ADDR == ''
        run: echo "::notice::Skipped until the VAULT_ADDR variable exists (house-manager infra/BOOTSTRAP.md)."
      # The job's own OIDC token logs in to the shared Vault (no Actions secrets).
      - name: Credentials from the shared Vault
        if: env.VAULT_ADDR != ''
        uses: michael-attias123/shared-platform/.github/actions/vault-env@main
        with:
          addr: ${{ vars.VAULT_ADDR }}
          role: house-manager-michael-attias123-house-manager-main
          secrets: |
            kv/data/house-manager/app supabase_db_url | SUPABASE_DB_URL
            kv/data/shared/supabase access_token | SUPABASE_ACCESS_TOKEN
      - uses: actions/checkout@v5
        if: env.SUPABASE_DB_URL != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_DB_URL != ''
        with:
          # A fixed version: "latest" asks the GitHub API, which rate-limits shared runners.
          version: 2.121.0
      - if: env.SUPABASE_DB_URL != ''
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
      # The database calls send-push with its own secret header, not a user's
      # JWT (supabase/config.toml says the same for local runs).
      - name: Deploy the send-push Edge Function
        if: env.SUPABASE_DB_URL != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      # Grafana's alert webhook signs its calls with an HMAC (ALERT_WEBHOOK_SECRET)
      # and has no JWT. Without that secret the function answers 503.
      - name: Deploy the alert-hook Edge Function
        if: env.SUPABASE_DB_URL != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase functions deploy alert-hook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Skip the Edge Functions until they can be deployed
        if: env.SUPABASE_DB_URL != '' && (env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == '')
        run: echo "::notice::No Supabase access token in the shared Vault (kv/shared/supabase) or no SUPABASE_PROJECT_REF variable (infra/ sets it), so the send-push and alert-hook functions are not deployed."
