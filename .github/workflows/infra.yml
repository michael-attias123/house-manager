name: Infrastructure

# infra/ (OpenTofu; the HCL also runs on Terraform, see infra/MIGRATING.md).
# - Pull request: static checks, then a plan, posted as one PR comment that
#   each run updates.
# - Main: static checks, then apply, then infra/scripts/post-apply.sh: the
#   Supabase Vault values (sync-vault.sh), the database role passwords
#   (sync-db-roles.sh) and, when the build variables changed, a Pages build.
# - Weekly and from the Actions tab: a drift check. A difference opens (or
#   updates) the issue labelled infra-drift and notifies the admins in the
#   app (infra/scripts/notify-drift.sh); no difference closes it. A due rotation of a minted token shows up
#   here as a replacement.
# - Actions tab with "apply main" ticked: apply main without a PR, for those
#   rotations.
# - repository_dispatch platform-changed: shared-platform sends it after a
#   merge that changes what this stack reads (a rotated Grafana token, say);
#   it applies main like a push. The downstream plan before that merge runs
#   in platform-check.yml.
# Plan, apply and drift run through shared-platform's tofu-stack.yml: the
# credentials come from the shared Vault with the job's OIDC token (no Actions
# secrets), and the github provider uses the house-manager-bot GitHub App.
# They skip with a notice until the VAULT_ADDR variable exists, and run
# bootstrap-check.yml first. The Grafana tokens are handed to OpenTofu only
# while observability_enabled is true (infra/scripts/grafana-env.sh).
# PLATFORM_REF (an Actions variable, default main) runs them against a
# shared-platform branch.
on:
  pull_request:
    # observability/alerts and alerting: the plan comment shows the rendered
    # alert changes. Dashboards are not in the plan (Git Sync pulls them).
    paths: ['infra/**', 'observability/alerts/**', 'observability/alerting/**', '.github/workflows/infra.yml', '.github/workflows/bootstrap-check.yml']
  push:
    branches: [main]
    # observability/** is applied by observability-sync.yml.
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/workflows/bootstrap-check.yml']
  schedule:
    - cron: '43 5 * * 1' # Monday 08:43 in Israel (summer time)
  repository_dispatch:
    types: [platform-changed]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply main now (for a due token rotation the drift check found) instead of only checking for drift'
        type: boolean
        default: false

permissions: {}

env:
  # 1.11 or later: write-only arguments (the Git Sync token).
  TOFU_VERSION: 1.12.8
  TERRAFORM_VERSION: 1.13.4
  TFLINT_VERSION: v0.59.1
  TRIVY_VERSION: v0.70.0
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

jobs:
  # Formatting, validation in both tools, lint and a security scan. Needs no
  # secrets, so it runs on every event, forks included.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    env:
      # Only encryption.tf reads it, and validate needs no real value.
      TF_VAR_state_passphrase: static-checks-only-not-a-real-passphrase
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive -diff
      - name: tofu validate
        run: |
          tofu init -backend=false -input=false
          tofu validate -no-color
      # Renders the alert YAML and dashboard files of its fixture through
      # mocked providers (no Grafana account needed).
      - name: tofu test (observability module)
        working-directory: infra/modules/observability/grafana_cloud
        run: |
          tofu init -backend=false -input=false
          tofu test -no-color
      # Terraform has no state encryption: validate a copy without encryption.tf
      # (and without tofu's provider cache and lock file).
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform validate (without encryption.tf)
        run: |
          dir="$RUNNER_TEMP/terraform"
          rm -rf "$dir" && mkdir -p "$dir"
          tar --exclude=./.terraform --exclude=./.terraform.lock.hcl -cf - . | tar -xf - -C "$dir"
          rm -f "$dir/encryption.tf"
          terraform -chdir="$dir" init -backend=false -input=false
          terraform -chdir="$dir" validate -no-color
      - uses: terraform-linters/setup-tflint@v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint
        env:
          # Plugin downloads, without the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
      - name: trivy config (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: infra
          skip-dirs: infra/.terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Which plans rebuild Pages (scripts/pages-rebuild.sh)
        run: ./scripts/test-pages-rebuild.sh

  # Decides whether plan, apply and drift can run.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: |
          if [[ -z "$VAULT_ADDR" ]]; then
            echo "::notice::Plan, apply and the drift check are skipped until the VAULT_ADDR variable exists (infra/BOOTSTRAP.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  bootstrap:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/bootstrap-check.yml
    with:
      vault-role: ${{ github.event_name == 'pull_request' && 'house-manager-michael-attias123-house-manager-pr' || 'house-manager-michael-attias123-house-manager-main' }}

  plan:
    needs: [static, bootstrap]
    if: github.event_name == 'pull_request'
    # A newer push to the same PR replaces its plan.
    concurrency:
      group: infra-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write
      issues: write
    uses: michael-attias123/shared-platform/.github/workflows/tofu-stack.yml@main
    with:
      dir: infra
      name: infra
      mode: plan
      tofu-version: 1.12.8
      vault-role: house-manager-michael-attias123-house-manager-pr
      vault-export-token: true
      github-app: true
      pre-plan: infra/scripts/grafana-env.sh
      platform-ref: ${{ vars.PLATFORM_REF || 'main' }}
      vault-secrets: |
        kv/data/house-manager/state pg_conn | PG_CONN_STR
        kv/data/house-manager/state passphrase | TF_VAR_state_passphrase
        kv/data/house-manager/providers cloudflare_api_token | CLOUDFLARE_API_TOKEN
        kv/data/house-manager/providers github_app_id | GITHUB_APP_ID
        kv/data/house-manager/providers github_app_private_key | GITHUB_APP_PRIVATE_KEY
        kv/data/shared/supabase access_token | SUPABASE_ACCESS_TOKEN
        kv/data/shared/grafana cloud_token | GRAFANA_CLOUD_TOKEN
        kv/data/shared/grafana sa_token | GRAFANA_SA_TOKEN

  apply:
    needs: [static, bootstrap]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && inputs.apply))
    concurrency:
      group: infra
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write
      issues: write
    uses: michael-attias123/shared-platform/.github/workflows/tofu-stack.yml@main
    with:
      dir: infra
      name: infra
      mode: apply
      tofu-version: 1.12.8
      vault-role: house-manager-michael-attias123-house-manager-main
      vault-export-token: true
      github-app: true
      pre-plan: infra/scripts/grafana-env.sh
      post-apply: infra/scripts/post-apply.sh
      platform-ref: ${{ vars.PLATFORM_REF || 'main' }}
      vault-secrets: |
        kv/data/house-manager/state pg_conn | PG_CONN_STR
        kv/data/house-manager/state passphrase | TF_VAR_state_passphrase
        kv/data/house-manager/providers cloudflare_api_token | CLOUDFLARE_API_TOKEN
        kv/data/house-manager/providers github_app_id | GITHUB_APP_ID
        kv/data/house-manager/providers github_app_private_key | GITHUB_APP_PRIVATE_KEY
        kv/data/shared/supabase access_token | SUPABASE_ACCESS_TOKEN
        kv/data/shared/grafana cloud_token | GRAFANA_CLOUD_TOKEN
        kv/data/shared/grafana sa_token | GRAFANA_SA_TOKEN
        kv/data/house-manager/app supabase_db_url | SUPABASE_DB_URL
        kv/data/house-manager/app push_secret | PUSH_SECRET
        kv/data/house-manager/monitoring grafana_reader_password | GRAFANA_READER_PASSWORD

  drift:
    needs: bootstrap
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !inputs.apply))
    concurrency:
      group: infra-drift
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write
      issues: write
    uses: michael-attias123/shared-platform/.github/workflows/tofu-stack.yml@main
    with:
      dir: infra
      name: infra
      mode: drift
      tofu-version: 1.12.8
      vault-role: house-manager-michael-attias123-house-manager-main
      vault-export-token: true
      github-app: true
      pre-plan: infra/scripts/grafana-env.sh
      post-drift: infra/scripts/notify-drift.sh
      drift-label: infra-drift
      allow-outage: true
      platform-ref: ${{ vars.PLATFORM_REF || 'main' }}
      vault-secrets: |
        kv/data/house-manager/state pg_conn | PG_CONN_STR
        kv/data/house-manager/state passphrase | TF_VAR_state_passphrase
        kv/data/house-manager/providers cloudflare_api_token | CLOUDFLARE_API_TOKEN
        kv/data/house-manager/providers github_app_id | GITHUB_APP_ID
        kv/data/house-manager/providers github_app_private_key | GITHUB_APP_PRIVATE_KEY
        kv/data/shared/supabase access_token | SUPABASE_ACCESS_TOKEN
        kv/data/shared/grafana cloud_token | GRAFANA_CLOUD_TOKEN
        kv/data/shared/grafana sa_token | GRAFANA_SA_TOKEN
        kv/data/house-manager/app supabase_db_url | SUPABASE_DB_URL
