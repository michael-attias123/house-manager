name: Store discovery

# Read-only: downloads the Stores files of every chain the scraper supports
# and lists the branches in the city, plus any branch matching a name. Use it
# to find which chain publishes a store before adding it to config.yaml.
on:
  workflow_dispatch:
    inputs:
      match:
        description: 'Branch name or address to look for (regex), e.g. צינור'
        required: false
        default: ''
  # Also when this workflow changes, so it can be tried from a branch.
  push:
    paths: ['.github/workflows/store-discovery.yml']

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - env:
          MATCH: ${{ inputs.match || 'צינור' }}
        run: python -m house_ingest discover --all-chains --match "$MATCH" --work-dir work
