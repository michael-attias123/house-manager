name: CI

# Every push, on any branch (all branches live in this repo).
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas this push touches (scripts/ci/changes.py): a job whose area
  # didn't change is skipped, and a skipped job counts as passed for branch
  # protection. A branch is compared with where it left main, so its last
  # push still runs every job the whole branch needs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      database: ${{ steps.diff.outputs.database }}
      functions: ${{ steps.diff.outputs.functions }}
      observability: ${{ steps.diff.outputs.observability }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin main
      - name: Test the path rules
        run: pip install 'pytest>=8' && python -m pytest scripts/ci -q
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: python scripts/ci/changes.py | tee -a "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo
      # The demo build runs on sample data and must never load or call Faro.
      - name: The demo build has no telemetry
        run: |
          if grep -rqE 'faro-collector|grafana\.net|@grafana/faro' dist-demo; then
            echo "::error::dist-demo references Faro or Grafana; the demo build must alias lib/telemetry to its no-op."
            exit 1
          fi

  # Dashboards, alert rules and policies in observability/ (Grafana GitOps),
  # and the reconciler's plan guard.
  observability:
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'PyYAML>=6,<7' 'pytest>=8'
      - run: python scripts/observability/validate.py --strict
      - run: python -m pytest scripts/observability -q

  # Edge Functions: type check, then the Deno tests (none yet is fine).
  functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    env:
      DENO_VERSION: 2.9.8
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: deno check
        run: find supabase/functions -name '*.ts' -print0 | sort -z | xargs -0 deno check
      - run: deno test --allow-env --permit-no-files supabase/functions

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingest/requirements-dev.txt
      - run: pip install -r ingest/requirements-dev.txt
      # Migrations + RLS/RPC checks (supabase/tests), then the price ingest tests.
      - run: ./scripts/db-test.sh
