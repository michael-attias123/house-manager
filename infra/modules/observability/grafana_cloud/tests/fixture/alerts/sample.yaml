# Test fixture only (tests/render.tftest.hcl): the contract's rule group
# schema. The real files are in observability/alerts at the repo root.
group: sample
interval: 1m
rules:
  - uid: hm-sample-down
    title: SampleDown
    for: 5m
    severity: critical
    push: true
    summary: "Sample target unreachable"
    summary_he: "בדיקה"
    runbook: sample-down
    no_data_state: OK
    exec_err_state: KeepLast
    condition: C
    data:
      - ref_id: A
        datasource_uid: grafanacloud-prom
        relative_time_range: { from: 900, to: 0 }
        model:
          expr: avg_over_time(probe_success{job="app"}[15m])
          refId: A
          instant: true
      - ref_id: C
        datasource_uid: __expr__
        relative_time_range: { from: 0, to: 0 }
        model:
          type: threshold
          expression: A
          refId: C
          conditions:
            - evaluator: { type: lt, params: [0.5] }
